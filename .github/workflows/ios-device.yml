name: iPhone test build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-device.yml'
      - 'iosApp/project.yml'

permissions:
  contents: read

jobs:
  package-ipa:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Archive for physical iPhone
        run: >
          xcodebuild -project iosApp/Senada.xcodeproj -scheme Senada
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Senada.xcarchive"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          CODE_SIGNING_ALLOWED=NO archive
      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          app="$RUNNER_TEMP/Senada.xcarchive/Products/Applications/Senada.app"
          plist="$app/Info.plist"
          platform=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$plist")
          if [[ "$platform" != iPhoneOS ]]; then
            echo "Expected iPhoneOS, found $platform" >&2
            exit 1
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          xcrun lipo "$app/$executable" -verify_arch arm64

          package="$RUNNER_TEMP/ipa"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/Senada.app"
          ditto -c -k --keepParent "$package/Payload" "$package/Senada-unsigned.ipa"
          unzip -tq "$package/Senada-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Senada-iPhone-unsigned-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipa/Senada-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
