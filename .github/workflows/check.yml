name: Mobile checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Senada-Android-debug-${{ github.run_number }}.${{ github.run_attempt }}
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: xcodegen generate --spec iosApp/project.yml
      - run: ./gradlew :composeApp:iosSimulatorArm64Test
      - name: Build iPhone simulator app
        run: >
          xcodebuild -project iosApp/Senada.xcodeproj -scheme Senada
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
