name: Android emulator test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-emulator.yml'
      - '.github/scripts/android_background_test.py'

permissions:
  contents: read

jobs:
  background-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Release build memory before starting the virtual Pixel.
      - run: ./gradlew --no-daemon -Pkotlin.compiler.execution.strategy=in-process :composeApp:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Background playback on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 .github/scripts/android_background_test.py build/android-e2e
      - name: Host diagnostics after emulator failure
        if: failure()
        run: |
          mkdir -p build/android-e2e
          sudo dmesg -T > build/android-e2e/runner-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-test-${{ github.run_number }}.${{ github.run_attempt }}
          path: build/android-e2e
          if-no-files-found: warn
          retention-days: 14
