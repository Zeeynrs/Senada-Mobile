name: Android release

# Membangun APK rilis yang ditandatangani kunci rilis tetap Senada (GitHub Secrets).
# Kunci yang sama di setiap rilis membuat update di aplikasi bisa memasang di atas versi lama.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SENADA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SENADA_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/senada-release.jks"
      - name: Build signed release APK
        env:
          SENADA_KEYSTORE_PATH: ${{ runner.temp }}/senada-release.jks
          SENADA_KEYSTORE_PASSWORD: ${{ secrets.SENADA_KEYSTORE_PASSWORD }}
          SENADA_KEY_ALIAS: ${{ secrets.SENADA_KEY_ALIAS }}
          SENADA_KEY_PASSWORD: ${{ secrets.SENADA_KEY_PASSWORD }}
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleRelease
      - name: Verify the release signature
        run: |
          apk=composeApp/build/outputs/apk/release/composeApp-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/signer.txt"
          grep -q "CN=Senada Mobile" "$RUNNER_TEMP/signer.txt"
          sha256sum "$apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/senada-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Senada-Android-release-${{ github.run_number }}.${{ github.run_attempt }}
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
          retention-days: 14
