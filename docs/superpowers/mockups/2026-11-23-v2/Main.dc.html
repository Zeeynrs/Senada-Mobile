<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Beranda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#67CDB1}a:hover{color:#8FE0C9}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A3A6AD}
.glass{background:rgba(29,31,35,.72);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.navbtn{width:64px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#A3A6AD;padding:0}
.tile{width:132px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.cover{width:132px;height:132px;border-radius:12px;position:relative;overflow:hidden}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0B0C0E;color:#F2F2F3;font-family:'Plus Jakarta Sans',sans-serif">

  <!-- Hero: sampul penuh dengan gradasi ke hitam -->
  <div style="position:absolute;left:0;top:0;width:390px;height:440px;background:#2B3440;overflow:hidden">
    <div style="position:absolute;left:150px;top:40px;width:300px;height:300px;border-radius:50%;background:#3E4A58"></div>
    <div style="position:absolute;left:-60px;top:190px;width:220px;height:220px;border-radius:50%;background:#46566A"></div>
    <div style="position:absolute;left:0;bottom:0;width:390px;height:260px;background:linear-gradient(180deg,rgba(11,12,14,0) 0%,#0B0C0E 92%)"></div>
    <div class="mono" style="position:absolute;right:16px;top:150px;color:rgba(242,242,243,.35)">[sampul hero]</div>
  </div>

  <!-- Bar atas -->
  <div style="position:absolute;left:20px;right:20px;top:52px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="9" fill="none" stroke="#F2F2F3" stroke-width="2"></rect><path d="M8 17c2-6 4 2 6-3s4 1 6-2" fill="none" stroke="#67CDB1" stroke-width="2.2" stroke-linecap="round"></path></svg>
      <span style="font-weight:800;font-size:18px;letter-spacing:-.02em">Senada</span>
    </div>
    <button aria-label="Buka profil" style="width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:#C9A86A;padding:0;color:#17181A;font-weight:800;font-family:inherit">A</button>
  </div>

  <!-- Isi hero -->
  <div style="position:absolute;left:20px;right:20px;top:318px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#C9CBD0;font-weight:600">
      <span>Karena kamu sering memutar</span>
      <span style="width:18px;height:18px;border-radius:50%;background:#8E7356;display:inline-block"></span>
      <span style="color:#F2F2F3">Nama Artis</span>
    </div>
    <div style="font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.05">Nama Playlist</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="glass" style="height:36px;padding:0 16px;border-radius:18px;color:#F2F2F3;font-family:inherit;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="#F2F2F3"></path></svg>Putar
      </button>
      <button class="glass" style="height:36px;padding:0 14px;border-radius:18px;color:#F2F2F3;font-family:inherit;font-weight:700;font-size:14px">Lihat</button>
    </div>
  </div>

  <!-- Baru diputar -->
  <div style="position:absolute;left:20px;top:478px;right:0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:4px;font-weight:800;font-size:18px">Baru diputar
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </div>
    <div style="display:flex;gap:12px">
      <div class="tile">
        <div class="cover" style="background:#21413A;display:flex;align-items:center;justify-content:center">
          <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="#67CDB1" stroke-width="1.8"></path></svg>
        </div>
        <div style="font-weight:700;font-size:14px">Favorit</div>
        <div style="font-size:12px;color:#A3A6AD;margin-top:-4px">Daftar favoritmu</div>
      </div>
      <div class="tile">
        <div class="cover" style="background:#4A3B2E"><div style="position:absolute;left:30px;top:30px;width:72px;height:72px;border-radius:50%;background:#6B5440"></div></div>
        <div style="font-weight:700;font-size:14px">Judul Album</div>
        <div style="font-size:12px;color:#A3A6AD;margin-top:-4px">Nama Artis</div>
      </div>
      <div class="tile">
        <div class="cover" style="background:#38304A"><div style="position:absolute;left:0;top:70px;width:132px;height:62px;background:#4D4266"></div></div>
        <div style="font-weight:700;font-size:14px">Judul Lagu</div>
        <div style="font-size:12px;color:#A3A6AD;margin-top:-4px">Nama Artis</div>
      </div>
    </div>
  </div>

  <!-- Mini player -->
  <div class="glass" style="position:absolute;left:16px;right:16px;bottom:96px;height:60px;border-radius:30px;display:flex;align-items:center;gap:12px;padding:0 8px">
    <div style="width:44px;height:44px;border-radius:22px;background:#5A2A22;flex-shrink:0"></div>
    <div style="flex-grow:1;min-width:0">
      <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Judul Lagu Diputar</div>
      <div style="font-size:12px;color:#A3A6AD">Nama Artis</div>
    </div>
    <button aria-label="Jeda" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#F2F2F3"></rect><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#F2F2F3"></rect></svg>
    </button>
    <button aria-label="Berikutnya" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 4l9 7-9 7zM11 4l9 7-9 7z" fill="#F2F2F3"></path></svg>
    </button>
  </div>

  <!-- Navbar: tombol paling kanan = Profil -->
  <nav class="glass" aria-label="Navigasi utama" style="position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px">
    <button class="navbtn" aria-label="Beranda" style="background:rgba(242,242,243,.12);color:#F2F2F3">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-6h-5v6H4z" fill="currentColor"></path></svg>
    </button>
    <button class="navbtn" aria-label="Cari">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
    </button>
    <button class="navbtn" aria-label="Library">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M13.5 8v6.2a2 2 0 1 1-1.5-1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <button class="navbtn" aria-label="Profil">
      <span style="width:28px;height:28px;border-radius:50%;background:#C9A86A;border:2px solid rgba(255,255,255,.2);color:#17181A;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-sizing:border-box">A</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
