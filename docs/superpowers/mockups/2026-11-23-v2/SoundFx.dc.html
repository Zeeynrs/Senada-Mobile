<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Efek suara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#67CDB1}a:hover{color:#8FE0C9}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A3A6AD}
.card{background:#17181B;border:1px solid #2A2C31;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.chip{height:40px;padding:0 16px;border-radius:20px;border:0;font-family:inherit;font-weight:700;font-size:14px;background:#1D1F23;color:#F2F2F3}
.on{background:#F2F2F3;color:#0B0C0E}
.sw{width:56px;height:32px;border-radius:16px;border:0;position:relative;padding:0;flex-shrink:0}
.knob{position:absolute;top:3px;width:26px;height:26px;border-radius:50%}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.trk{height:6px;border-radius:3px;background:#2A2C31;position:relative}
.fil{height:6px;border-radius:3px;background:#67CDB1}
.th{position:absolute;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#F2F2F3}
</style>
</helmet>
<div style="width:390px;height:1100px;position:relative;overflow:hidden;background:#0B0C0E;color:#F2F2F3;font-family:'Plus Jakarta Sans',sans-serif">
<div style="padding:52px 16px 40px;display:flex;flex-direction:column;gap:14px">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <a href="AudioLab.dc.html" aria-label="Kembali ke Audio Lab" style="width:44px;height:44px;border-radius:50%;background:#1D1F23;display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
    <div class="mono">Audio Lab</div>
  </div>

  <div style="font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:.98;padding:8px 4px 6px">Efek<br>suara</div>

  <!-- Reverb -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex-grow:1"><div style="font-weight:800;font-size:17px">Reverb</div><div style="font-size:12px;color:#A3A6AD">Memberi kesan ruang pada lagu</div></div>
      <button class="sw" aria-label="Reverb aktif" style="background:#67CDB1"><span class="knob" style="right:3px;background:#0B0C0E"></span></button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="chip on">Kamar</button><button class="chip">Studio</button><button class="chip">Aula</button><button class="chip">Katedral</button>
    </div>
    <div class="lbl"><span>Campuran</span><span style="color:#A3A6AD">30%</span></div>
    <div class="trk"><div class="fil" style="width:30%"></div><div class="th" style="left:30%"></div></div>
    <div class="lbl" style="margin-top:4px"><span>Ukuran ruang</span><span style="color:#A3A6AD">55%</span></div>
    <div class="trk"><div class="fil" style="width:55%"></div><div class="th" style="left:55%"></div></div>
  </div>

  <!-- Bass boost -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex-grow:1"><div style="font-weight:800;font-size:17px">Bass boost</div><div style="font-size:12px;color:#A3A6AD">Menebalkan nada rendah</div></div>
      <button class="sw" aria-label="Bass boost aktif" style="background:#67CDB1"><span class="knob" style="right:3px;background:#0B0C0E"></span></button>
    </div>
    <div class="lbl"><span>Kekuatan</span><span style="color:#A3A6AD">40%</span></div>
    <div class="trk"><div class="fil" style="width:40%"></div><div class="th" style="left:40%"></div></div>
  </div>

  <!-- Kecepatan & nada -->
  <div class="card">
    <div style="font-weight:800;font-size:17px">Kecepatan &amp; nada</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="chip">0,75×</button><button class="chip on">1,00×</button><button class="chip">1,25×</button><button class="chip">1,50×</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:2px">
      <div style="flex-grow:1"><div style="font-weight:700;font-size:14px">Kunci nada</div><div style="font-size:12px;color:#A3A6AD">Mati: nada ikut naik-turun seperti piringan hitam</div></div>
      <button class="sw" aria-label="Kunci nada aktif" style="background:#67CDB1"><span class="knob" style="right:3px;background:#0B0C0E"></span></button>
    </div>
  </div>

  <!-- Penguat suara -->
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex-grow:1"><div style="font-weight:800;font-size:17px">Samakan volume</div><div style="font-size:12px;color:#A3A6AD">Lagu pelan dan keras terdengar setara</div></div>
      <button class="sw" aria-label="Samakan volume nonaktif" style="background:#2A2C31"><span class="knob" style="left:3px;background:#A3A6AD"></span></button>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
