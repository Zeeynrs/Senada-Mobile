<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#67CDB1}a:hover{color:#8FE0C9}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A3A6AD}
.card{background:#17181B;border:1px solid #2A2C31;border-radius:24px}
.glass{background:rgba(29,31,35,.72);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.navbtn{width:64px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#A3A6AD;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;background:transparent;width:100%;text-align:left;color:#F2F2F3;font-family:inherit;box-sizing:border-box;min-height:64px}
.ico{width:40px;height:40px;border-radius:12px;background:#1D1F23;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#F2F2F3}
.sep{height:1px;background:#2A2C31;margin-left:70px}
</style>
</helmet>
<div style="width:390px;height:1320px;position:relative;overflow:hidden;background:#0B0C0E;color:#F2F2F3;font-family:'Plus Jakarta Sans',sans-serif">
<div style="padding:56px 16px 200px;display:flex;flex-direction:column;gap:14px">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
    <div style="font-size:26px;font-weight:800;letter-spacing:-.03em">Halo lagi, Adit!</div>
    <button aria-label="Cari pengaturan" style="width:44px;height:44px;border-radius:50%;border:1px solid #2A2C31;background:#17181B;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="#F2F2F3" stroke-width="2"></circle><path d="M16 16l4 4" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <!-- Kartu pendengar -->
  <div class="card" style="position:relative;overflow:hidden;padding:18px;display:flex;gap:16px;align-items:center;background:#1D1F23">
    <div style="position:absolute;right:-24px;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center">
      <div class="mono" style="transform:rotate(90deg);white-space:nowrap;color:#5D6168">KARTU · SENADA · KARTU</div>
    </div>
    <div style="width:84px;height:84px;border-radius:50%;background:#C9A86A;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#17181A">A</div>
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <div class="mono">Kartu pendengar</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:22px;font-weight:800;letter-spacing:-.02em">Adit</span>
        <button aria-label="Ubah nama dan foto" style="width:32px;height:32px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linejoin="round"></path></svg>
        </button>
      </div>
      <div style="font-size:12px;color:#A3A6AD;font-weight:600">Mendengar sejak 21 Nov 2026</div>
    </div>
  </div>

  <!-- Waktu dengar -->
  <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1">12<span style="font-size:20px;color:#A3A6AD">j</span></span>
        <span style="width:1px;height:38px;background:#2A2C31;align-self:center"></span>
        <span style="font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1">40<span style="font-size:20px;color:#A3A6AD">m</span></span>
      </div>
      <div class="mono" style="text-align:right;line-height:1.5">Total waktu<br>dengar · 30 hari</div>
    </div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:56px" role="img" aria-label="Grafik waktu dengar harian, 7 hari terakhir">
      <div style="flex:1;height:30%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:55%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:40%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:80%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:62%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:45%;border-radius:4px;background:#2A2C31"></div>
      <div style="flex:1;height:100%;border-radius:4px;background:#67CDB1"></div>
    </div>
    <div style="height:1px;background:#2A2C31"></div>
    <a href="#" style="display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#F2F2F3;font-weight:700;font-size:14px;min-height:28px">Lihat statistik lengkap
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </a>
  </div>

  <!-- Ringkas: lagu & artis teratas -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div class="mono">Artis teratas</div>
      <div style="width:52px;height:52px;border-radius:50%;background:#8E7356"></div>
      <div style="font-weight:800;font-size:15px">Nama Artis</div>
      <div style="font-size:12px;color:#A3A6AD;margin-top:-6px">48 putaran</div>
    </div>
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div class="mono">Lagu teratas</div>
      <div style="width:52px;height:52px;border-radius:10px;background:#5A2A22"></div>
      <div style="font-weight:800;font-size:15px">Judul Lagu</div>
      <div style="font-size:12px;color:#A3A6AD;margin-top:-6px">21 putaran</div>
    </div>
  </div>

  <div style="font-size:20px;font-weight:800;letter-spacing:-.02em;padding:10px 4px 0">Pengaturan</div>

  <!-- Grup pengaturan -->
  <div class="card" style="overflow:hidden">
    <button class="row">
      <span class="ico" style="background:#21413A;color:#67CDB1"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="6" cy="14" r="2.4" fill="currentColor"></circle><circle cx="12" cy="8" r="2.4" fill="currentColor"></circle><circle cx="18" cy="16" r="2.4" fill="currentColor"></circle></svg></span>
      <span style="flex-grow:1"><span style="display:block;font-weight:700;font-size:15px">Audio Lab</span><span style="display:block;font-size:12px;color:#A3A6AD">Equalizer, efek suara, kecepatan &amp; nada</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <div class="sep"></div>
    <button class="row">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg></span>
      <span style="flex-grow:1"><span style="display:block;font-weight:700;font-size:15px">Tampilan</span><span style="display:block;font-size:12px;color:#A3A6AD">Tema, aksen, sudut sampul, efek kaca</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <div class="sep"></div>
    <button class="row">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg></span>
      <span style="flex-grow:1"><span style="display:block;font-weight:700;font-size:15px">Pemutaran</span><span style="display:block;font-size:12px;color:#A3A6AD">Kualitas audio, hemat data, timer tidur</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <div class="card" style="overflow:hidden">
    <button class="row">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="flex-grow:1"><span style="display:block;font-weight:700;font-size:15px">Backup library</span><span style="display:block;font-size:12px;color:#A3A6AD">Ekspor &amp; impor, cocok dengan Senada desktop</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <div class="sep"></div>
    <button class="row">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.5" fill="none" stroke="currentColor" stroke-width="2"></ellipse><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5" fill="none" stroke="currentColor" stroke-width="2"></path></svg></span>
      <span style="flex-grow:1"><span style="display:block;font-weight:700;font-size:15px">Penyimpanan</span><span style="display:block;font-size:12px;color:#A3A6AD">Cache, audio impor</span></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <!-- Versi (gaya Mochy) -->
  <div class="card" style="padding:18px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div class="mono">Versi &amp; tentang</div>
      <div style="font-size:36px;font-weight:800;letter-spacing:-.04em">0.9.0</div>
    </div>
    <button style="height:40px;padding:0 16px;border-radius:20px;border:0;background:#2A2C31;color:#F2F2F3;font-family:inherit;font-weight:700;font-size:13px">Tentang Senada</button>
  </div>
</div>

  <!-- Mini player + navbar (Profil aktif) -->
  <div class="glass" style="position:absolute;left:16px;right:16px;bottom:96px;height:60px;border-radius:30px;display:flex;align-items:center;gap:12px;padding:0 8px">
    <div style="width:44px;height:44px;border-radius:22px;background:#5A2A22;flex-shrink:0"></div>
    <div style="flex-grow:1;min-width:0">
      <div style="font-weight:700;font-size:14px">Judul Lagu Diputar</div>
      <div style="font-size:12px;color:#A3A6AD">Nama Artis</div>
    </div>
    <button aria-label="Jeda" style="width:44px;height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="#F2F2F3"></rect><rect x="12" y="3" width="4" height="14" rx="1.5" fill="#F2F2F3"></rect></svg></button>
  </div>
  <nav class="glass" aria-label="Navigasi utama" style="position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px">
    <button class="navbtn" aria-label="Beranda"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-6h-5v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg></button>
    <button class="navbtn" aria-label="Cari"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"></circle><path d="M16 16l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
    <button class="navbtn" aria-label="Library"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M13.5 8v6.2a2 2 0 1 1-1.5-1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <button class="navbtn" aria-label="Profil" style="background:rgba(242,242,243,.12)"><span style="width:28px;height:28px;border-radius:50%;background:#C9A86A;border:2px solid #F2F2F3;color:#17181A;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-sizing:border-box">A</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
