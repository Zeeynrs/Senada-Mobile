<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sedang diputar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#67CDB1}a:hover{color:#8FE0C9}
.gbtn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;padding:0;color:#F2F2F3;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tbtn{border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{base}};color:#F2F2F3;font-family:'Plus Jakarta Sans',sans-serif">

  <!-- Latar: warna dari sampul yang diblur (BitChord) -->
  <div style="position:absolute;left:-120px;top:-80px;width:520px;height:520px;border-radius:50%;background:{{glow}};opacity:.75;filter:blur(90px)"></div>
  <div style="position:absolute;left:180px;top:420px;width:360px;height:360px;border-radius:50%;background:{{glow2}};opacity:.6;filter:blur(100px)"></div>
  <div style="position:absolute;left:0;top:0;width:390px;height:844px;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)"></div>

  <!-- Pegangan + sumber -->
  <div style="position:absolute;left:0;right:0;top:50px;display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.45)"></div>
    <div style="font-size:13px;font-weight:600;color:rgba(242,242,243,.85)">Diputar dari Pencarian</div>
  </div>

  <!-- Sampul besar -->
  <div style="position:absolute;left:24px;top:112px;width:342px;height:342px;border-radius:20px;background:{{art}};overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45)">
    <div style="position:absolute;left:96px;top:60px;width:170px;height:170px;border-radius:50%;background:{{glow}}"></div>
    <div style="position:absolute;left:0;bottom:0;width:342px;height:110px;background:rgba(0,0,0,.25)"></div>
    <div style="position:absolute;left:16px;bottom:14px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:rgba(242,242,243,.5)">[SAMPUL LAGU]</div>
  </div>

  <!-- Judul + aksi -->
  <div style="position:absolute;left:24px;right:24px;top:484px;display:flex;align-items:center;gap:10px">
    <div style="flex-grow:1;min-width:0">
      <div style="font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Judul Lagu</div>
      <div style="font-size:19px;font-weight:600;color:rgba(242,242,243,.62)">Nama Artis</div>
    </div>
    <button class="gbtn" aria-label="Tambahkan ke favorit">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
    </button>
    <button class="gbtn" aria-label="Menu lainnya">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="18" cy="12" r="1.8" fill="currentColor"></circle></svg>
    </button>
  </div>

  <!-- Baris lirik aktif -->
  <button style="position:absolute;left:24px;right:24px;top:556px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:6px;color:rgba(242,242,243,.9);font-family:inherit;font-size:15px;font-weight:700;text-align:left">
    <span>Baris lirik yang sedang dinyanyikan</span>
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
  </button>

  <!-- Progres -->
  <div style="position:absolute;left:24px;right:24px;top:598px">
    <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden" role="img" aria-label="Posisi pemutaran 0:30 dari 3:19">
      <div style="width:15%;height:6px;background:#F2F2F3;border-radius:3px"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:600;color:rgba(242,242,243,.6)">
      <span>0:30</span><span>-2:49</span>
    </div>
  </div>

  <!-- Transport -->
  <div style="position:absolute;left:24px;right:24px;top:660px;display:flex;align-items:center;justify-content:space-around">
    <button class="tbtn" aria-label="Sebelumnya" style="width:64px;height:64px">
      <svg width="44" height="30" viewBox="0 0 44 30" aria-hidden="true"><path d="M22 2L4 15l18 13zM42 2L24 15l18 13z" fill="#F2F2F3"></path></svg>
    </button>
    <button class="tbtn" aria-label="Jeda" style="width:76px;height:76px">
      <svg width="40" height="44" viewBox="0 0 40 44" aria-hidden="true"><rect x="5" y="2" width="10" height="40" rx="3" fill="#F2F2F3"></rect><rect x="25" y="2" width="10" height="40" rx="3" fill="#F2F2F3"></rect></svg>
    </button>
    <button class="tbtn" aria-label="Berikutnya" style="width:64px;height:64px">
      <svg width="44" height="30" viewBox="0 0 44 30" aria-hidden="true"><path d="M2 2l18 13L2 28zM22 2l18 13-18 13z" fill="#F2F2F3"></path></svg>
    </button>
  </div>

  <!-- Baris bawah: lirik, timer, Audio Lab, antrean -->
  <div style="position:absolute;left:32px;right:32px;bottom:34px;display:flex;align-items:center;justify-content:space-between">
    <button class="gbtn" aria-label="Lirik">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><path d="M9 9h6M9 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    </button>
    <button class="gbtn" aria-label="Timer tidur">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
    </button>
    <button class="gbtn" aria-label="Audio Lab">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="6" cy="14" r="2.4" fill="#F2F2F3"></circle><circle cx="12" cy="8" r="2.4" fill="#F2F2F3"></circle><circle cx="18" cy="16" r="2.4" fill="#F2F2F3"></circle></svg>
    </button>
    <button class="gbtn" aria-label="Antrean">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><path d="M17 15v6l4-3z" fill="currentColor"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","options":["Hangat","Malam","Hijau"],"default":"Hangat"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = {
      'Hangat': { base: '#1C0F08', glow: '#B4521E', glow2: '#6E1E12', art: '#3A1C10' },
      'Malam': { base: '#0B0E1A', glow: '#3B4FA0', glow2: '#5A2C78', art: '#1A2040' },
      'Hijau': { base: '#0A1412', glow: '#2E7D63', glow2: '#3D5C2A', art: '#15302A' }
    };
    return tones[this.props.tone ?? 'Hangat'] ?? tones['Hangat'];
  }
}
</script>
</body>
</html>
